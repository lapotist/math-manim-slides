independent_check = "For (1), 3^2+4^2=5^2, so the triangle is right and its area is 3*4/2=6. For (2), scaling every side by 2 produces a similar triangle with every altitude also scaled by 2, hence area multiplier 2^2=4. For (3), along median CM_c the centroid satisfies CG:GM_c=2:1, so G has one third of C's perpendicular distance from AB; thus Delta(A,G,B)=K/3, and midpoint M_c splits it into two equal K/6 triangles, with the other four obtained cyclically. Independently, put G at the origin and let the vertex vectors be u,v,w, so u+v+w=0. The three vectors close head-to-tail and form a triangle of area K/3: its area is |u cross v|/2, whereas the original area is 3|u cross v|/2. Since AG, BG, CG are 2/3 of the corresponding medians, scaling that vector triangle by 3/2 gives the median-side triangle, whose area is (K/3)(3/2)^2=3K/4. Applying the operation twice gives 16*(3/4)^2=9. For (4), let K=Delta(a,b,c)=45 and H=Delta(h_a,h_b,h_c)=30. From K=a h_a/2 and H=h_a h'_a/2, h'_a=(H/K)a=(2/3)a; cyclically the second-altitude triangle has side lengths 2/3 of the original, so its area is 45*(2/3)^2=20."
