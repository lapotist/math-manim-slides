source_note = "The four PDF pages define T(a,b,c) by its three side lengths and Delta(a,b,c) as its area, then ask for Delta(3,4,5), the area multiplier when all sides double, the area after applying the median-side-triangle operation twice to area 16, and the area after applying the altitude-side-triangle operation twice when the first two areas are 45 and 30. All four worked regions in the PDF are blank. The confirmed-public video writes the first two answers as 6 and 4, constructs the median triangle and applies its 3/4 area factor twice to obtain 9, then compares paired base-height area formulas to obtain the cyclic 3:2 side ratio and final area 20. Reconciled settled subquestion ranges are 00:00-00:20.90, 00:21.50-00:34.70, 00:35.10-03:39.70, and 03:40.30-07:19.25; intervening page-swipe frames are excluded. The complete result remains unobstructed through 00:07:19.25 and a device overlay begins at 00:07:19.30. The inspected 518x360 stream is 439.994921 seconds long and has SHA-256 a074ecdb1ba38ad6d706d2bd66a028035511b85f3f974255beac892bbbbd230e. This lesson independently derives the median factor with centroid vectors and verifies every numerical identity exactly. No PDF/video frames, handwriting, audio, branding, or source wording are incorporated."
