independent_check = "Any three real numbers in arithmetic progression with sum 15 can be written 5-d, 5, 5+d. Their product is 5(25-d^2)=80, hence d^2=9 and d is 3 or -3. Both signs give the same unordered set {2,5,8}; its sum is 15 and product is 80. Exhaustive permutation gives the six three-digit values 258, 285, 528, 582, 825, and 852, whose unique maximum is 852. Equivalently, swapping a larger digit leftward increases a numeral: if x<8 occupies the hundreds place while 8 has weight w in {10,1}, the gain is (8-x)(100-w)>0; after fixing 8 in the hundreds place, 5*10+2 exceeds 2*10+5 by 27."
