source_note = "The PDF page contains the problem statement and a blank worked area. In the public video, the complete visible Q1 argument occupies 00:00-00:45.90; the final unobstructed frame remains settled at 00:45.90 and a device overlay begins by 00:45.95. The source writes the progression as 5-d, 5, 5+d, uses the product to obtain d=3 or d=-3, identifies the values 2, 5, 8, and reports 852. It does not visibly justify why descending digit order is maximal, so this lesson adds an original place-value swap argument. All lesson visuals, motion, wording, and code are project-original."
