expected_answer = "星期四"
independent_check = "Weekdays form a cycle of length 7. Since 2024=7*289+1, 2024 is congruent to 1 modulo 7, hence 2024^112 is congruent to 1^112=1 modulo 7. Exact integer modular exponentiation independently gives pow(2024,112,7)=1; 2024^112 has 371 decimal digits and (2024^112-1) is divisible by 7. Using the convention that 0 days after Wednesday is Wednesday, adding the remainder gives weekday index (3+1) mod 7=4, namely Thursday. Boundary checks agree: 1 day gives Thursday, 7 days gives Wednesday, and 8 and 15 days both give Thursday."
tags = ["modular-arithmetic", "weekday-cycle", "remainders", "exponentiation", "periodicity"]

