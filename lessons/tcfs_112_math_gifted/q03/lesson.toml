source_note = "The PDF page contains the four-person prize-allocation statement and a blank worked area. The public video visibly sets percentage shares a,b,c,d; writes a+b=40, a+c=60, a+d=50; adds them to obtain 3a+b+c+d=150; compares this with a+b+c+d=100 to get 2a=50; recovers shares 25,15,35,25; and scales the known 315 for the 35-percent share to the 25-percent share, reporting 225. The complete result remains unobstructed through 01:32.05, while a device overlay begins by 01:32.10. This lesson preserves that reasoning, makes the subtraction of one whole prize pool concrete, and adds an original 5-percent unit-bar scaling. All visuals, motion, wording, and code are project-original."
