independent_check = "Let total prize money be T>0 and let A,B,C,D be the four awards. Normalize by T: a=A/T, b=B/T, c=C/T, d=D/T. The clues are a+b=2/5, a+c=3/5, a+d=1/2, and a+b+c+d=1. Adding the three pair clues gives 3a+b+c+d=3/2; subtracting the total equation gives 2a=1/2, so a=1/4. Therefore b=3/20, c=7/20, and d=1/4. Every share is positive, all four sum to 1, and the three pair equations check exactly, so the solution is admissible and unique. Since C=315=(7/20)T, T=900. Thus D=(1/4)T=225. Equivalently, d/c=(1/4)/(7/20)=5/7 and 315*5/7=225."
