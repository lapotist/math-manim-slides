source_note = "The PDF page gives the exact trapezoid problem and leaves the worked area blank. The confirmed-public video constructs G where the extensions of BE and CD meet, uses triangle GEC congruent to triangle BEA to obtain GC=AB, subtracts CD to get GD:AB=2:3, then uses triangle GDF similar to triangle BAF to obtain DF:AF=2:3 and AF/AD=3/5. Full frame inspection found the Q4 page present from 00:00; the last unobstructed solution frame is 01:48.80 and the device overlay begins immediately afterward. This lesson reconstructs the proof with project-original geometry, wording, and motion, and explicitly excludes zero-base and zero-height degeneracies."
