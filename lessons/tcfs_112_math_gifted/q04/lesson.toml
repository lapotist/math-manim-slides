independent_check = "Normalize a nondegenerate convex trapezoid as A=(0,0), B=(3u,0), D=(d,h), C=(d+u,h), where u>0 and h is nonzero. Then E=((d+u)/2,h/2). Solving A+t(D-A)=B+s(E-B) gives s=6/5 and t=3/5, so F lies strictly inside AD and AF/AD=3/5, independent of d and h. For the source construction, the line BE reaches the top base line at G=D-2(C-D). Thus GC=3u=AB and GD=2u. The midpoint and parallel-line angles give triangle GEC congruent to triangle BEA; the vertical and corresponding angles give triangle GDF similar to triangle BAF, hence DF/AF=GD/AB=2/3 and AF/(AF+DF)=3/(3+2)=3/5. The line intersection is undefined in the collapsed h=0 case, and u=0 does not give positive trapezoid bases."
