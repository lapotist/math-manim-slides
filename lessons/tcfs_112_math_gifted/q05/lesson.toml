independent_check = "For positive x, x+1 is nonzero, so solutions are exactly the roots of Q_p(x)=5x^2-5px+(6p+45). If its two distinct positive integer roots are alpha<beta, Vieta gives alpha+beta=p and 5alpha*beta=6p+45, hence (5alpha-6)(5beta-6)=261. Each factor is at least -1. Because their positive product is 261, both would have to share a sign; the only possible negative value is -1, which cannot pair with another value at least -1 to produce 261, so both factors are positive. The positive factor pairs of 261 are exactly (1,261), (3,87), and (9,29); requiring both factors to be congruent to 4 modulo 5 leaves only (9,29). Thus alpha=3, beta=7, and p=alpha+beta=10. Conversely Q_10(x)=5(x-3)(x-7), while the discarded common root x=-1 is not positive, so there are exactly two positive integer solutions. Directly, f(3)=360=10*g(3) and f(7)=2320=10*g(7)."
