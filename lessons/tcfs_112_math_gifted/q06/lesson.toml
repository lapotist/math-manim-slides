source_note = "The PDF page contains the two quadratic functions and a blank worked area. The public video visibly uses the existence of a maximum for f to require a<0, finds the vertex x-coordinate 1, sets 5a-3/a=2, solves the resulting quadratic in a, rejects the positive root, keeps a=-3/5, finds the vertex x-coordinate 2 for g, and evaluates its minimum as -1. The complete solution is unobstructed through 01:54.75; a device-control overlay begins by 01:54.80. The inspected 518x360 research stream is 115.472834 seconds long and has SHA-256 926e08c9dcc0bcd5b3ee22b4ebe4ce45ebdfbf9670af6540fa168518c80ffe81. This lesson independently expresses the same mathematics with original graphs, number-line motion, wording, and code."
