independent_check = "Because f is a quadratic containing 3/a, a is nonzero. A finite maximum on all real x further forces a<0. Completing the square gives f(x)=a(x-1)^2+5a-3/a, so its maximum is 5a-3/a=2. Hence 5a^2-2a-3=(5a+3)(a-1)=0. The roots are -3/5 and 1, but a<0 selects the unique admissible value a=-3/5; the other root gives f(x)=(x-1)^2+2, whose value 2 is a minimum and which is unbounded above. Substitution gives f(x)=-(3/5)(x-1)^2+2, verifying the stated maximum. For the admissible parameter, g(x)=-a(x-2)^2+10a-3/a=(3/5)(x-2)^2-1, so g(x)>=-1 for every real x, with equality uniquely at x=2. Therefore the requested minimum is -1."
