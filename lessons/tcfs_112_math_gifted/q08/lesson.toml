independent_check = "Let m be the original number of balls in A, with old means x_A and x_B. Both post-move averages must be defined and B must initially contain a ball, so 2<=m<=24. Removing 15 from A gives m*x_A-15=(m-1)(x_A+1/4), hence x_A=15+(m-1)/4=(m+59)/4. Adding 15 to B gives (25-m)*x_B+15=(26-m)(x_B+1/4), hence x_B=15-(26-m)/4=(m+34)/4. The total of labels 1 through 25 is 325. Substitution into m*x_A+(25-m)*x_B=325 yields the unique real, hence unique integer-domain, solution m=9. Feasibility is checked independently by A={13,14,15,16,17,18,19,20,21} and B={1,...,12,22,23,24,25}. Their original sums and means are 153/9=17 and 172/16=43/4. After moving 15, the means are 138/8=69/4 and 187/17=11, each exactly 1/4 above its original value."
