independent_check = "Place triangle T_i at vertices (i/2,0), (i/2+1,0), and (i/2+1/2,sqrt(3)/2), for i=0,...,n-1; this is exactly a horizontal half-side translation. The union boundary starts at (0,0), rises along one full outer side, alternates between adjacent apexes through valleys at height sqrt(3)/4 using 2(n-1) half-side slants, descends along one full outer side, and closes along a bottom segment of length (n+1)/2. Hence the slanted boundary is 2+2(n-1)/2=n+1 and r_n=3(n+1)/2, giving r_112=339/2. One triangle has area sqrt(3)/4. Exact convex-polygon intersection shows that T_i and T_(i+1) overlap in an equilateral triangle of side 1/2 and area sqrt(3)/16; T_i and T_j for |i-j|=2 meet only at one point, and those farther apart are disjoint. Any three distinct indices contain two whose difference is at least 2, so no triple intersection has positive area. Therefore s_n=n*sqrt(3)/4-(n-1)*sqrt(3)/16=(3n+1)*sqrt(3)/16, giving s_112=337*sqrt(3)/16. An exact shoelace and edge-length audit of the explicit union polygons gives (r_1,s_1)=(3,sqrt(3)/4), (r_2,s_2)=(9/2,7*sqrt(3)/16), and (r_3,s_3)=(6,5*sqrt(3)/8), agreeing with both general formulas."
