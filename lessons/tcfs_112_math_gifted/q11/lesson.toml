source_note = "The PDF page states that P is interior to square ABCD, gives 2*BP^2=CP^2-AP^2, and asks for angle APB; its worked area is blank and cannot verify a solution. The confirmed-public video labels AP=a, BP=b, and CP=c, rotates P by a quarter-turn about B in the same direction that sends A to C, and calls the image point E. It uses BE=BP, CE=AP, PE=sqrt(2)*BP, the converse of Pythagoras in triangle CEP, and the 45-degree base angle of right-isosceles triangle BPE to obtain the answer. The complete result remains unobstructed through 00:02:46.85; a device overlay begins at 00:02:46.90. The inspected 208x144 research stream is 167.740952 seconds long and has SHA-256 bf297c3f85804a54ac57f951d443f492624397eb100335c12592400211cb955c. This lesson independently verifies the claim with exact coordinates and vector dot/determinant signs, tests an exact non-interior counterexample, and re-expresses the source construction with project-original geometry, motion, wording, and code. No PDF or video frames, handwriting, audio, branding, or source wording are incorporated."
