independent_check = "Put D=(0,0), A=(0,s), B=(s,s), C=(s,0), and P=(x,y), where 0<x,y<s. Define u=s-x and v=s-y, so the interior condition gives u>0 and v>0. Then BP^2=u^2+v^2, CP^2=u^2+(s-v)^2, and AP^2=(s-u)^2+v^2. Substitution in 2*BP^2=CP^2-AP^2 simplifies exactly to u^2+v^2=s(u-v). The vectors PA=(u-s,v) and PB=(u,v) have dot product u^2-su+v^2=-sv and determinant (u-s)v-vu=-sv. Hence PA dot PB<0 while |det(PA,PB)|=sv=-(PA dot PB)>0. For the undirected angle theta in (0,180 degrees), sin(theta)=-cos(theta)>0 and cos(theta)<0, so theta=135 degrees. The exact interior examples P=(2/5,4/5) and P=(3/5,4/5) for s=1 both satisfy the distance condition and the same dot/determinant signature. Interior is essential: with s=1 and P=(0,2), 2*BP^2=4=CP^2-AP^2 still holds, but vectors PA=(0,-1), PB=(1,-1) give angle APB=45 degrees."
