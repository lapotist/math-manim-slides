independent_check = "Let H_0 be the unit-side regular hexagon centered at G, with apothem r=sqrt(3)/2, and let H_theta be its rotation by theta. Because a regular hexagon is invariant under a 60-degree rotation, the overlap area A is 60-degree periodic. Reflection in a symmetry axis of H_0 sends H_theta to H_(-theta)=H_(60-theta) within one period and preserves area, so every rotation reduces to 0<=theta<=30 degrees. The overlap H_0 intersect H_theta is the intersection of two six-line support systems, all tangent to the same circle of radius r. For 0<theta<60 degrees its twelve consecutive outward-normal gaps alternate theta and 60-theta, six of each; at theta=0 the coincident line pairs give the original six-sided hexagon, the continuous degenerate endpoint. Two consecutive tangent lines whose normal gap is delta meet in a corner. Their tangency points and G form two congruent right triangles with tangent leg r*tan(delta/2), so that corner contributes r^2*tan(delta/2). Therefore A(theta)=6r^2[tan(theta/2)+tan((60-theta)/2)]. Put x=theta/2 and y=(60-theta)/2, so x+y=30 degrees. Then tan(x)+tan(y)=sin(30)/(cos(x)cos(y))=1/[2cos(x)cos(y)], while 2cos(x)cos(y)=cos(30)+cos(x-y)<=sqrt(3)/2+1, with equality exactly when x=y=15 degrees. Thus A is minimized at theta=30 degrees. Substitution gives A_min=12*(3/4)*tan(15)=9*tan(15). The angle-difference identity gives tan(15)=2-sqrt(3), hence A_min=18-9sqrt(3). Independently, the scene constructs every intersection vertex by solving pairs of support-line equations and checks its shoelace area against the formula at 0,4,12,21,30,39,56,60 degrees; it also verifies reflection samples, the six-to-twelve-side endpoint transition, integer-degree monotonicity on [0,30], and the exact final value numerically."
