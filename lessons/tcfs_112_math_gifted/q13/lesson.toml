independent_check = "Direct every recommendation edge from an existing recommender to the new member. Time order makes the graph acyclic; every nonfounder has indegree one and every founder has indegree zero, so it is a rooted forest. Recursive color inheritance makes each component monochromatic, while distinct founders have distinct colors; hence the color count equals the number r of roots. If d(v) is the total number of direct recruits of member v, then every nonroot is counted exactly once, so 685-r=sum_v d(v). Each d(v) is 0, 7, 14, 28, or 35, hence 685-r is divisible by 7 and r is congruent to 685, namely 6 modulo 7. Since r is positive, r>=6. Attainment is not inferred from the congruence: begin with six founders; for each of 97 sequential steps choose an existing member who has not recruited before, let that member recruit exactly seven new members, and choose one of those new members for the next step. This creates 6+97*7=685 members, exactly 97 vertices of outdegree 7, every other vertex of outdegree 0, and exactly six roots/colors, so p=6. For the other extreme, every color has a founder and founders are members, so the color count is at most 685. Taking all 685 members as initial founders gives 685 distinct colors and no edges; the conditional restriction on anyone who recruits is then vacuously satisfied. Therefore q=685 and (p,q)=(6,685)."
tags = ["combinatorics", "rooted-forest", "invariant", "congruence", "extremal-construction", "vacuous-truth"]

[problem_display]
kind = "project_restatement"
locale = "zh-TW"
text = "某社群現有 685 名社員；除創社社員外，每人加入時都由恰好一位當時已在社群中的社員推薦，並繼承推薦人的認證顏色，而不同創社社員的顏色互異。每位曾推薦他人的社員，其累計直接推薦人數必為 7、14、28、35 之一，且目前無人退社。若認證顏色種數的最小值與最大值分別為 p、q，求 (p,q)。"

