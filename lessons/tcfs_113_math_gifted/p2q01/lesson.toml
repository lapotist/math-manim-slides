kind = "project_restatement"
locale = "zh-TW"
text = "從 O 出發，在夾角為 θ 的兩條指定射線上交替走相等步長，其餘落點都留在射線正向，並在最後一步首次回到 O。分別求五步與七步構形的 θ；再設奇數步數 n≥3 且 θ=m°，求 mn。"

