expected_answer = "36 degrees; 180/7 degrees; mn = 180 within the displayed same-ray first-closure zigzag family; not universal on unrestricted full lines"
independent_check = "For odd n, let theta=180/n degrees and h=(n-1)/2. Consecutive unit edges form isosceles triangles whose outward-half base angles satisfy alpha_1=theta and alpha_{j+1}=alpha_j+theta, so alpha_h=h theta. The outer triangle has angles theta,h theta,h theta, hence theta+2h theta=n theta=180 degrees. In coordinates, set r_k=sin(k theta)/sin(theta), put odd k at (r_k,0) and even k at r_k(cos(theta),sin(theta)); every consecutive distance is 1, r_n=0, and r_k>0 for 1<=k<n. Exact degree arithmetic gives theta=36 for n=5 and theta=180/7 for n=7. Positivity is essential: with n=5 and theta=72 degrees the same coordinate recurrence closes and keeps unit steps, but r_3 and r_4 are negative, so the path uses the opposite line extensions and mn=360."
tags = ["geometry", "angles", "isosceles-triangle", "recurrence", "invariant", "scope"]

