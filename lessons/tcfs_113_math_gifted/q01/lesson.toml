independent_check = "Since 4=2^2, 8=2^3, and 2048=2^11, equality is equivalent to x+2y+3z=11. For z=1, positive pairs solve x+2y=8 and are (6,1), (4,2), (2,3), giving 3. For z=2, positive pairs solve x+2y=5 and are (3,1), (1,2), giving 2. At z=3 the positive minimum is x+2y+3z=1+2+9=12>11, so no z>=3 is possible. Total: 3+2=5 ordered triples."
