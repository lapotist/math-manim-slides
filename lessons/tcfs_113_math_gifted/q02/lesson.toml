independent_check = "Let k=a3+a5, so k is 0, 1, or 2. The fixed a1=1 makes the odd-position sum 1+k, hence exactly 1+k of the three even positions must equal 1. The number in case k is C(2,k)C(3,1+k): 3, 6, and 1 respectively, for a total of 10. Exhaustive enumeration of the 32 length-six binary words beginning with 1 yields exactly the same ten words and case counts."
