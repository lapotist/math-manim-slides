independent_check = "For sorted offsets 0<=a<b<c<=5, b>=(a+b+c)/3 iff b-a>=c-b. Let L=b-a and R=c-b. Positive gaps therefore satisfy L>=R and L+R<=5. The possible pairs (L,R) are (1,1),(2,1),(3,1),(4,1),(2,2),(3,2), and each pair has 6-(L+R) translations, contributing 4,3,2,1,2,1 for a total of 13. Exhaustive evaluation of all C(6,3)=20 triples independently gives 13 valid choices."
