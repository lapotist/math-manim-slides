source_note = "Frame-by-frame inspection places the Q3-to-Q4 page transition between about 02:51.3 and 02:51.6; the Q4 page is settled by 02:52 and remains through the 04:27 endpoint. The source sets the sides to x-1, x, x+1, derives x>2 from triangle existence, x<=37 2/3 from the perimeter, and x<0 or x>4 from the acute condition before rejecting the negative branch and reporting 5<=x<=37. This lesson preserves those claims but gives them an original visual order: a collapsing triangle first, square-area boundary tests at n=4 and n=5, then a visible intersection with the perimeter range."
