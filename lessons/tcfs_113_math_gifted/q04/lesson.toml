independent_check = "Write the consecutive positive-integer side lengths as n-1, n, n+1. Triangle existence requires (n-1)+n>n+1, hence n>2 and integer n>=3. Since n+1 is the longest side, the triangle is acute exactly when (n-1)^2+n^2>(n+1)^2. This simplifies to n(n-4)>0; positivity excludes n<0, so integer n>=5. The perimeter is 3n, and 3n<=113 gives n<=37. Therefore n is any integer from 5 through 37 inclusive, a total of 37-5+1=33. Direct enumeration gives the same range and count."
