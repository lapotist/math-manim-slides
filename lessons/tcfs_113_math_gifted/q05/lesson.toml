expected_answer = "210"
independent_check = "Each factor contributes exponent 0 or one of 1,2,4,8,16,32,64. Since binary subset sums are unique, exponent 113 has the sole decomposition 64+32+16+1, selecting factors 7,6,5,1. Their scalar product is 7*6*5*1=210. A direct coefficient-array expansion of all seven sparse factors has degree 127 and coefficient[113]=210; exhaustive enumeration of all 128 subsets finds exactly the index set {1,5,6,7}."
