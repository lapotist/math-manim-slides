source_note = "Frame inspection shows Q5 through 01:29.2; the page turn begins near 01:29.3 and Q6 is visible by 01:29.5. The source directly writes 113=64+32+16+1 and multiplies 7*6*5*1. It does not explicitly justify why no other factor selection reaches exponent 113. This lesson adds a small choose/skip model and a binary-place uniqueness argument before using the source multiplication."
