independent_check = "For x<=0 and positive p,q, every term of x^2-px+q is nonnegative and q is strictly positive, so the two real roots a,b are positive. In a three-term GP the middle square equals the product of the ends. A positive root cannot be the middle because the end product would be (-6) times the other positive root, which is negative. Therefore -6 is the middle and ab=(-6)^2=36. In an AP, -6 is the smallest term; after naming the smaller root a and larger root b, the only ascending order is -6,a,b, so a+6=b-a and b=2a+6. Combining with ab=36 gives a(2a+6)=36, or (a-3)(a+6)=0. Positivity leaves a=3 and b=12. The six permutations have exactly two AP orders, (-6,3,12) and its reverse, and exactly two GP orders, (3,-6,12) and its reverse; the remaining two satisfy neither. Finally p=a+b=15 and q=ab=36, hence p+q=51."
