source_note = "Frame inspection places the Q5-to-Q6 transition near 01:29, with Q6 settled by 01:30 and continuing through the 03:35 endpoint. The source uses root sum/product signs, considers progression orderings, obtains ab=36 from the geometric middle, and reports roots 3 and 12 before p+q=51. This lesson independently delays coefficient comparison until the root pair is settled: it proves root positivity directly from the polynomial on x<=0, exhausts all three geometric-middle choices, derives the arithmetic gap relation, and finally audits all six numerical permutations. All visuals, motion, wording, and code are project-original."
