source_note = "Frame inspection shows Q7 settled from 00:00 through 03:31. The 03:32 frame is an ambiguous page transition, and Q8 is settled from 03:33, so the Q7 locator ends at 03:31. The source rewrites the quadratic as (x-3)^2+3, separates the interval into three positions relative to x=3, and uses endpoint fixed-point equations in the surviving increasing-branch case. This lesson preserves that argument while making the first two exclusions visual through the global floor f(x)>=3, then delays all fixed-point algebra until the endpoint extrema have been identified on the graph. No source imagery, audio, or wording is reused."
