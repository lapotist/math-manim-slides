independent_check = "Complete the square: f(x)=(x-3)^2+3, so f(x)>=3. If a<3 and b<3, f decreases on [a,b], hence its minimum is f(b)>3>a, impossible. If a<3<=b, the interval contains x=3, hence its minimum is 3>a, also impossible. Thus a>=3. For 3<=x<y, f(y)-f(x)=(y-x)(x+y-6)>0, so f is increasing on [a,b]. Therefore the required minimum a and maximum b are f(a) and f(b), giving f(a)=a and f(b)=b. Fixed points satisfy x^2-7x+12=(x-3)(x-4)=0, so the only candidates are 3 and 4. Since a<b, (a,b)=(3,4). Finally, for 3<=x<=4, 0<=(x-3)^2<=1, so 3<=f(x)<=4; the actual range is [3,4]."
