source_note = "Frame inspection shows Q7 still visible at 03:31 and an ambiguous page transition at 03:32; Q8 is fully settled at 03:33 and continues through the 06:17 endpoint. The source writes CE=36k and BE=23k, hence the square side is 59k, uses the equal-area center together with similar triangles, and applies the positive-integer conditions on OD and the side to obtain the minimum side 13 and area 169. This lesson independently avoids assuming that k is integral: it names the side s, proves the left intersection height from the half-area trapezoid, reduces OD:s to 23:13, and only then proves that the common scale t is a positive integer. All visuals, motion, wording, and code are project-original."
