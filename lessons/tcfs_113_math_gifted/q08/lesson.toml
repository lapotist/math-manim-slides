independent_check = "Let the square side be s>0 and let F=OE intersect AD. Since CE/BE=36/23 and CE+BE=s, CE=36s/59 and BE=23s/59. The region DCEF below OE is a trapezoid with parallel sides DF and CE separated by distance s. It is half the square, so ((DF+CE)/2)s=s^2/2, hence DF+CE=s and DF=23s/59. Right triangles ODF and OCE are similar because OD and OC are collinear, OF and OE are collinear, and both have a right angle. Thus OD/(OD+s)=OD/OC=DF/CE=23/36. Cross multiplication gives 13OD=23s, so OD:s=23:13. Since OD and s are positive integers and gcd(23,13)=1, OD=23t and s=13t for a positive integer t. The least side is 13 at t=1, so the least area is 13^2=169. At OD=23 and s=13, CE=36s/59, BE=DF=23s/59, the given ratio is 36/23, DF+CE=s gives exactly half the square, and both required lengths are positive integers."
