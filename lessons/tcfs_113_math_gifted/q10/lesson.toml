expected_answer = "64/5"
independent_check = "Use D=(0,0), C=(16,0), B=(16,8), A=(0,8), so AC has equation x+2y=16. Reflecting B across this line gives B'=(48/5,-24/5). For P on AC, PB=PB', hence PQ+PB=PQ+PB'>=QB'. The shortest segment from B' to line AB is perpendicular to AB, with foot Q=(48/5,8), and 0<48/5<16 verifies Q lies on segment AB. The vertical QB' meets AC at P=(48/5,16/5); since 8>16/5>-24/5, Q,P,B' are aligned in the required order and P lies on segment AC. Thus equality is attainable. Finally QB'=8-(-24/5)=64/5."
