source_note = "Frame inspection confirms that Q10 is settled from 01:26 through 05:50. The source reflects B across AC, changes PB to PB', straightens the resulting broken path, and then computes the perpendicular distance geometrically with area and ratio relations. This lesson preserves the reflection and straightening argument but independently introduces coordinates only near the end so that the reflected point, the perpendicular foot on segment AB, and the attainable equality point on segment AC are all checked explicitly. No source frames, handwriting, audio, or wording are incorporated."
