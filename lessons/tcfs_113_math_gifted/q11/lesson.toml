source_note = "Frame inspection shows the complete Q11 work from 00:00 through 02:59, while Q12 is fully settled at 03:00. The source groups consecutive squares by digit width, obtains cumulative boundaries 81 and 1438, computes offsets 113-81=32 and 2024-1438=586, and reads the fourth digits of 39^2=1521 and 414^2=171396 to report (1,3). This lesson preserves that argument but makes the 1-index convention and boundary transitions 81/82 and 1438/1439 explicit. In particular, it writes 32=7*4+4 rather than silently interpreting a zero division remainder, so the target is visibly the fourth digit of the eighth four-digit square. All visuals, motion, wording, and code are project-original."
