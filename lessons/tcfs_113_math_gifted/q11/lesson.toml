independent_check = "Concatenate str(n^2) for n=1,2,... until the stream has at least 2024 digits. Direct 1-indexed lookup gives stream[112]='1' and stream[2023]='3'. Symbolically, one-digit squares n=1..3 contribute 3 digits (cumulative 3); two-digit squares n=4..9 contribute 6*2=12 (cumulative 15); three-digit squares n=10..31 contribute 22*3=66 (cumulative 81); four-digit squares n=32..99 contribute 68*4=272 (cumulative 353); five-digit squares n=100..316 contribute 217*5=1085 (cumulative 1438); six-digit squares begin at n=317. Position 113 has offset 32 after position 81. Since 32=7*4+4, seven complete four-digit squares precede the target and it is digit 4 of n=32+7=39; 39^2=1521 gives 1. Position 2024 has offset 586 after position 1438. Since 586=97*6+4, 97 complete six-digit squares precede the target and it is digit 4 of n=317+97=414; 414^2=171396 gives 3. Boundary checks identify position 81 as the last digit of 31^2, 82 as the first digit of 32^2, 1438 as the last digit of 316^2, and 1439 as the first digit of 317^2, eliminating off-by-one alternatives."
