independent_check = "The centroid of A=(1,-3), B=(7,-3), C=(-2,9) is G=(2,1). Since G lies on ax+by=9, 2a+b=9 and b=9-2a. The restrictions a>=1 and b>=5 give 1<=a<=2. Therefore f(a)=2a^2+(9-2a)^2=6a^2-36a+81=6(a-3)^2+27. On [1,2], the distance 3-a is positive and strictly decreases, so f strictly decreases. Equivalently, for 1<=u<v<=2, f(v)-f(u)=6(v-u)(u+v-6)<0. Thus M=f(1)=51 and m=f(2)=33, so (M,m)=(51,33)."
