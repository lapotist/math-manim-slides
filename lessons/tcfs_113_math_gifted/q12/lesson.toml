source_note = "Frame inspection places the Q11-to-Q12 transition at approximately 02:59.5-03:00.5; the collection locator remains 03:00-04:11, and Q12 is fully settled by about 03:00.5. The source computes the centroid, obtains 2a+b=9, restricts 1<=a<=2, completes the square in 2a^2+b^2, and evaluates the endpoints. This lesson independently reconstructs that reasoning with original coordinate, moving-line, coefficient-segment, square-area, and parabola visuals. No PDF or video frames, handwriting, audio, or wording are incorporated."
