independent_check = "Let F(a)=a^3+7a^2-5a+8 for positive integers a,b with F(a)=(b+1)^3. Exact polynomial subtraction gives F(a)-(a+1)^3=4(a-1)^2+3>0, F(a)-(a+2)^3=a(a-17), and (a+3)^3-F(a)=2a^2+32a+19>0. If 1<=a<17, then (a+1)^3<F(a)<(a+2)^3, so F(a) cannot be an integer cube. If a>17, then (a+2)^3<F(a)<(a+3)^3, again impossible. The factor a(a-17) also has a=0, and indeed F(0)=8=2^3, but a=0 is excluded by the stated positive-integer domain. At a=17, F(17)=19^3, hence b+1=19 and b=18. Therefore the unique positive-integer pair is (17,18)."
