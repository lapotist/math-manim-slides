source_note = "Local frame inspection confirms that the 73.194-second public clip contains Q13 throughout. The completed Q13 work remains settled through about 01:12.4; an operating-system overlay begins near 01:12.6, and no adjacent problem appears before the clip ends. The source places F(a) between a^3 and (a+3)^3, reduces the candidate cube roots to a+1 or a+2, rejects the first case by its quadratic discriminant, and factors the second case as a(a-17)=0. This lesson independently reorganizes the argument as three exact consecutive-cube comparisons, with original cube-rail, sign-line, and positive-term visuals. The excluded root a=0 is shown explicitly because the problem requires positive integers. No PDF or video frames, handwriting, audio, or wording are incorporated."
