independent_check = "An upward-opening quadratic always enters quadrants I and II. With Delta>0 it is negative between its two real roots. Their product is a+3: a negative product puts the roots on opposite sides and yields all four quadrants, while a nonnegative product keeps the negative interval on one side, including a=-3 where the roots are 0 and 3. Thus a is in [-3,-2) union (6,infinity). The target equals (a-2021)^2-10, and a=2021 is admissible, so its attained minimum is -10."
