[problem_display]
kind = "project_restatement"
locale = "zh-TW"
text = "設 a>0，且 {x}=x-floor(x) 表示 x 的小數部分。若方程 floor(x){x}=ax² 的所有實數解為 x₁,x₂,…,xₘ，並滿足 x₁+x₂+⋯+xₘ=345，求 a。"

