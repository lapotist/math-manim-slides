expected_answer = "No positive a; the stated sum 345 is inconsistent"
independent_check = "For a>0, every nonzero solution is positive with n=floor(x)>=1. Writing a=t(1-t), 0<t<=1/2, only x_n=n/(1-t)=cn can lie in [n,n+1). If the solutions are n=1,...,N and sum to 345, then c=690/[N(N+1)]. Since c>1, N<=25; validity of x_N requires 690<(N+1)^2, impossible because (N+1)^2<=676. For the corrected sum 420, N=28, c=210/203, t=1/30, and a=29/900; x_29=30 verifies that the next index is excluded."
