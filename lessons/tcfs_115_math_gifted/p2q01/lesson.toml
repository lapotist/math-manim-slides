independent_check = "Subtracting equations 1 and 2 gives (y-z)(x+y+z-3)=0. If y=z, equation 3 gives 3y^2-5y-1=0, hence y=(5+/-sqrt(37))/6; the remaining x-quadratic has discriminant y+8>0. If x+y+z=3, equations 2-3 give x=1, and equation 1 gives y^2-2y-2=0, hence y=1+/-sqrt(3), with z=2-y."
