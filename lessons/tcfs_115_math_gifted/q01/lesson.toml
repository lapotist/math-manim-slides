locale = "zh-TW"
text = "在三角形 ABC 中，∠B>∠C。AD 是 ∠A 的內角平分線並交 BC 於 D；AE 是 ∠A 的外角平分線，交 BC 在 B 外側的延長線於 E。若 AE=√3·AD，求 4∠C-2∠B+∠A。"

