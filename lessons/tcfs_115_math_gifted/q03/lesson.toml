[problem_display]
kind = "project_restatement"
locale = "zh-TW"
text = "對整數 k，-5≤k≤5，令 fₖ(x)=x²+2kx+(k+1)。圖形恰好經過三個象限的 k 共有 m 個；方程 fₖ(x)=0 有正整數解的 k 共有 n 個。求 (m,n)。"

