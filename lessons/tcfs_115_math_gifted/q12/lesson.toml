independent_check = "Rotate P and C clockwise 90 degrees about A. Then PP'=sqrt(2)AP and C'P'=CP, so the objective is the broken path B-P-P'-C', bounded below by BC'. Equality is attainable when those four points are collinear. Coordinates A=(0,0), B=(2,-2sqrt(3)), C=(-2,-2sqrt(3)) give C'=(-2sqrt(3),2), BC'=2sqrt(6)+2sqrt(2), and the equality point P=(0,-(2sqrt(3)-2)), so AP=2sqrt(3)-2."
