[workspace]
name = "manim-project"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.13.*"
manim = "==0.20.1"
gh = ">=2.96.0,<3"
tectonic = "==0.16.9"

[target.unix.activation]
scripts = ["scripts/activate.sh"]

[tasks]
check = "manim checkhealth"
prepare-tex = "python scripts/prepare_tex.py"
test = "python -m unittest discover -s tests -v"
qa-slides = "python scripts/qa_slides.py"
review-slides = "python scripts/review_site.py"
review-slides-build = "python scripts/review_site.py --build-only"
publish-review-status = "python scripts/publish_review_status.py"
build-public-site = "python scripts/build_site.py"
freeze-qa = "python scripts/freeze_qa.py"
inventory-site = "python scripts/inventory_site.py"
build-source-catalog = "python scripts/build_source_catalog.py"
import-source-access-audit = "python scripts/import_source_access_audit.py"
import-site-taxonomy = "python scripts/import_site_taxonomy.py"
update-readme = "python scripts/update_readme.py"
update-sources = "python scripts/update_sources.py"
check-sources = "python scripts/update_sources.py --check"
validate-catalog = "python scripts/validate_catalog.py"
check-slide-density = "python scripts/slide_density.py"
lessons = "python scripts/build_lessons.py"
render-q9 = "manim-slides render --quality h --media_dir build/media/question_9 lessons/tcfs_115_math_gifted/q09/deck.py Question9Slide"
present-q9 = "manim-slides present Question9Slide"
export-q9 = "python scripts/build_lessons.py export carlo.tcfs_115_math_gifted.q09"

[pypi-dependencies]
manim-slides = { version = "==5.6.0", extras = ["pyside6"] }
carlo-math-slides = { path = ".", editable = true }
