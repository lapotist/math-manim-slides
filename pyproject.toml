[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "carlo-math-slides"
version = "0.1.0"
description = "Shared Manim components for the Carlo Math slide collection"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.urls]
Homepage = "https://github.com/lapotist/carlo-math-manim-slides"
Repository = "https://github.com/lapotist/carlo-math-manim-slides"

[tool.setuptools.packages.find]
where = ["src"]
